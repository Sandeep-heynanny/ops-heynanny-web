# Firebase App Hosting config for the ops dashboard (backend: heynanny-ops).
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # "HeyNanny Ops" web app: public identifiers, inlined at build time.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyATmN4_pfGDJFSluN3-qEVQGeMP45mqav8
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hey-nanny-web.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hey-nanny-web
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: hey-nanny-web.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "721087730968"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:721087730968:web:738a5a8d41873c9c54ba6d
    availability: [BUILD, RUNTIME]
